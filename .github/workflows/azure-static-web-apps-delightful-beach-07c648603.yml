name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_BEACH_07C648603 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: ".next" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
          NEXT_PUBLIC_URI_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_URI_API_BASE_URL_PROD }}
          URI_DEV_URL: ${{ secrets.URI_DEV_URL }}
          URI_PROD_URL: ${{ secrets.URI_PROD_URL }}
          NEXT_PUBLIC_URI_IMAGE_DETECTION_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_URI_IMAGE_DETECTION_API_BASE_URL }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET_PROD }} 
          NEXT_PUBLIC_AZURE_BLOB_STORAGE_BASE_URL: ${{ secrets.NEXT_PUBLIC_AZURE_BLOB_STORAGE_BASE_URL_PROD }}
          NEXT_PUBLIC_CLIENT_HOST: ${{ secrets.NEXT_PUBLIC_CLIENT_HOST }}
          GOOGLE_AUTH_URL_V2: ${{ secrets.GOOGLE_AUTH_URL_V2 }}
          GOOGLE_FCM_ENDPOINT: ${{ secrets.GOOGLE_FCM_ENDPOINT }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_REDIRECT_PATH: ${{ secrets.NEXT_PUBLIC_REDIRECT_PATH }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_SERVER_KEY: ${{ secrets.FIREBASE_SERVER_KEY }}
          FIREBASE_VAPID_PUBLIC_KEY: ${{ secrets.FIREBASE_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_TRANSITIONAL_VIDEO_URL: ${{ secrets.NEXT_PUBLIC_TRANSITIONAL_VIDEO_URL_PROD }}
          NEXT_PUBLIC_INFLUENCER_TRACKING_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_INFLUENCER_TRACKING_REDIRECT_URL_PROD }}
          NEXT_PUBLIC_CONTENT_MANAGEMENT_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_CONTENT_MANAGEMENT_REDIRECT_URL_PROD }}
          NEXT_PUBLIC_DISCOUNT_CODE: "ALX500"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
