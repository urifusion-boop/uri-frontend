# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Node.js app to Azure Web App
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: npm install and build
        run: |
          npm ci
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build
      - name: Create deployment package
        run: |
          # Remove dev dependencies but keep the built app
          npm prune --production
          # Create zip with all necessary files including node_modules
          zip -r release.zip . -x "*.git*" "*.github*" "*node_modules/.cache*"
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CE4B58B545D141BAAF5C3457DD332B58 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8C1A038B9CF64D6C8B3255718E1540A6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0E275EF339394B79AB6D79F3F5F0AD24 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'uri-frontend-2'
          slot-name: 'Production'
          package: .